<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="佀佳超（同州禹斋）的博客文章阅读页">
  <meta name="author" content="佀佳超">
  <meta name="theme-color" content="#1c1c1c">
  <meta name="color-scheme" content="dark">

  <title>文章 · 佀佳超 | 同州禹斋</title>

  <link rel="shortcut icon" href="./assets/images/logo.ico" type="image/x-icon">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/logo-1-color.png">

  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/reader.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link rel="dns-prefetch" href="https://unpkg.com">
</head>

<body>

  <!-- 粒子背景 -->
  <canvas id="particles-canvas" aria-hidden="true"></canvas>

  <main class="reader-main">

    <!-- 顶部工具栏：返回 + 标题 -->
    <header class="reader-topbar">
      <a href="./index.html" class="reader-back" aria-label="返回主页">
        <ion-icon name="arrow-back"></ion-icon>
        <span>返回</span>
      </a>
      <span class="reader-brand">佀佳超 · 同州禹斋</span>
    </header>

    <!-- 文章主体 -->
    <article class="reader-content" id="reader-content" data-reader>

      <div class="reader-loading" id="reader-loading">
        <span class="reader-spinner"></span>
        <p>正在加载文章…</p>
      </div>

      <div class="reader-error" id="reader-error" hidden>
        <ion-icon name="alert-circle-outline"></ion-icon>
        <p>文章不存在或加载失败。</p>
        <a href="./index.html" class="reader-btn">返回主页</a>
      </div>

      <!-- 文章实际渲染区（由 JS 填充 front-matter 头 + 正文） -->
      <div id="reader-article" hidden></div>

    </article>

  </main>

  <!-- marked：Markdown 渲染引擎 -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>

  <script src="./assets/js/reader.js"></script>

  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

</body>
</html>
