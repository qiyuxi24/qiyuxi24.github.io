<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发布工作台 · 同州禹斋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap">
<!-- Vditor 编辑器（开源 MIT，B3log 出品）：本地化自 assets/vendor/vditor -->
<link rel="stylesheet" href="./assets/vendor/vditor/dist/index.css">
<!-- 发布工作台专用样式（含折叠布局），逻辑见 assets/js/publish.js -->
<link rel="stylesheet" href="./assets/css/publish.css">
</head>
<body>

<header class="topbar">
  <div class="brand">发布工作台<span class="sub">Markdown · 图片 · 公式 · 一键发布</span></div>
  <div class="top-actions">
    <span class="count" id="post-count"></span>
    <button class="btn" id="btn-open-site" title="打开网站主页">打开网站</button>
  </div>
</header>

<div class="layout" id="layout">
  <!-- 左栏：文章列表（可折叠成 36px 竖条，按钮在标题行右侧） -->
  <aside class="panel list-panel">
    <div class="side-body">
      <div class="panel-head">
        <span class="panel-title">文章列表</span>
        <div class="panel-head-actions">
          <button class="btn btn-primary" id="btn-new">+ 新建文章</button>
          <button class="icon-btn" id="btn-side-toggle" title="收起文章列表，专注写作">«</button>
        </div>
      </div>
      <input class="search" id="search" placeholder="搜索标题 / slug…">
      <div class="post-list" id="post-list"></div>
    </div>
    <button class="side-rail" id="side-rail" title="展开文章列表">»</button>
  </aside>

  <!-- 中栏：元数据（可折叠成顶部「写作设置」条）+ Vditor 编辑器（即时渲染，所见即所得） -->
  <main class="panel editor-panel">
    <div class="meta-wrap" id="meta-wrap">
      <div class="meta-bar" id="meta-bar" title="点击折叠 / 展开元数据表单">
        <span class="meta-bar-label">写作设置</span>
        <span class="meta-bar-title" id="meta-title">未命名文章</span>
        <button class="btn meta-toggle" id="btn-meta-toggle" type="button" title="折叠 / 展开元数据表单">收起</button>
      </div>

      <form class="meta-form" id="meta-form" autocomplete="off">
        <div class="field-row">
          <div class="field grow">
            <label>标题 *</label>
            <input id="f-title" placeholder="文章标题">
          </div>
          <div class="field">
            <label>slug（英文小写）</label>
            <input id="f-slug" placeholder="自动生成">
          </div>
          <div class="field">
            <label>日期</label>
            <input id="f-date" type="date">
          </div>
          <div class="field cat">
            <label>分类</label>
            <input id="f-category" list="category-list" placeholder="随笔">
          </div>
        </div>
        <!-- 分类建议（基础四项 + 已有文章用过的分类，由 publish.js 动态填充），可自由输入新分类 -->
        <datalist id="category-list"></datalist>
        <div class="field-row">
          <div class="field grow">
            <label>标签（逗号分隔）</label>
            <input id="f-tags" placeholder="AI, 笔记">
          </div>
          <div class="field check">
            <label title="置顶文章会排在博客列表最前"><input type="checkbox" id="f-pinned"> 置顶</label>
          </div>
          <div class="field check">
            <label><input type="checkbox" id="f-published" checked> 发布</label>
          </div>
        </div>
        <div class="field">
          <label>摘要（列表页简介，可留空）</label>
          <input id="f-summary" placeholder="一句话摘要">
        </div>
        <div class="field">
          <label>封面图路径</label>
          <div class="cover-row">
            <input id="f-cover" placeholder="./assets/images/blog-4.jpg">
            <button class="btn" type="button" id="btn-cover-random" title="用 Delaunator 三角网随机生成封面（可反复点击换一张）">随机生成</button>
            <button class="btn" type="button" id="btn-cover" title="上传封面图到 assets/images/posts/">上传</button>
          </div>
        </div>
      </form>
    </div>

    <div id="vditor"></div>

    <div class="editor-foot">
      <span id="foot-info"></span>
      <div class="actions">
        <button class="btn" id="btn-preview" title="保存后在新窗口打开文章页">预览文章</button>
        <button class="btn btn-primary" id="btn-save" title="保存 .md 并重建索引与 RSS">保存并发布</button>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast" hidden></div>
<input type="file" id="file-input" accept="image/*" hidden>

<!-- delaunator（Mapbox，ISC 协议）：随机封面三角网底层算法，本地化自 assets/vendor/delaunator -->
<script src="./assets/vendor/delaunator/delaunator.min.js"></script>
<!-- Vditor 主库（本地化；公式/代码高亮/中文语言包均从本地 vendor 目录加载） -->
<script src="./assets/vendor/vditor/dist/index.js"></script>
<!-- 发布工作台逻辑（独立维护，见文件头注释） -->
<script src="./assets/js/publish.js"></script>
</body>
</html>
